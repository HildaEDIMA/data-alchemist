[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-alchemist"
version = "0.1.0"
description = "An auditable statistical discovery layer for AI data analysts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
agents = ["anthropic>=0.40", "openai>=1.50", "python-dotenv>=1.0"]
benchmark = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
data-alchemist-bench = "benchmark.run:main"

[tool.setuptools]
packages = ["api", "core", "benchmark"]
py-modules = ["generate_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
